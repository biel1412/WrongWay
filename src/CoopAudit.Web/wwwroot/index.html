<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoopAudit</title>
    <meta name="description" content="Auditoria de acesso por cooperativa: veja quem atuou sem estar na lista de autorizados." />
    <meta name="theme-color" content="#0B2A22" />
    <!-- O deploy do GitHub Pages troca este href pelo nome do repositório (ex.: /coop-audit/) -->
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preload" href="fonts/schibsted-grotesk-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <img src="img/logo-mark.svg" width="64" height="64" alt="" />
            <div class="boot-title">CoopAudit</div>
            <div class="boot-bar"><span></span></div></div>
    </div>

    <div id="blazor-error-ui">
        Ocorreu um erro inesperado.
        <a href="." class="reload">Recarregar</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
