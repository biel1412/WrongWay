# Publica o Nexus no GitHub Pages a cada push na branch main.
# Pré-requisito (uma vez só): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Compilação AOT deixa a leitura de planilhas mensais grandes bem mais rápida no navegador.
      - name: Instalar ferramentas WebAssembly (AOT)
        id: workload
        continue-on-error: true
        run: dotnet workload install wasm-tools

      - name: Publicar (AOT)
        id: aot
        if: steps.workload.outcome == 'success'
        continue-on-error: true
        run: dotnet publish src/Nexus.Web/Nexus.Web.csproj -c Release -o out -p:RunAOTCompilation=true

      # Se o AOT falhar por qualquer motivo, publica no modo normal (funciona igual, só é mais lento).
      - name: Publicar (padrão)
        if: steps.workload.outcome != 'success' || steps.aot.outcome != 'success'
        run: |
          rm -rf out
          dotnet publish src/Nexus.Web/Nexus.Web.csproj -c Release -o out

      - name: Ajustar caminho base para o GitHub Pages
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          sed -i "s|<base href=\"/\" />|<base href=\"$BASE\" />|" out/wwwroot/index.html
          # Evita que o navegador use CSS/JS antigos do cache depois de uma atualização
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"(css/[a-z]+\.css|js/app\.js)\"#\1=\"\2?v=$V\"#g" out/wwwroot/index.html
          sed -i -E "s#(\.woff2)\"#\1?v=$V\"#g" out/wwwroot/css/fonts.css
          cp out/wwwroot/index.html out/wwwroot/404.html
          touch out/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
